name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Run News Parser"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-yandex
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload site to bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync . s3://internationals-site \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "scripts/*" \
            --exclude "node_modules/*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "LICENSE" \
            --exclude ".gitignore" \
            --exclude "*.php" \
            --exclude "Calli.mp3"
