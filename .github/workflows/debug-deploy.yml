name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch actual body with browser UA
        continue-on-error: true
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          echo "== body with browser UA (http) ==" > debug_log.txt
          curl -s --max-time 10 -A "$UA" http://internationals.site/ >> debug_log.txt 2>&1
          echo >> debug_log.txt
          echo "== body with browser UA (https) ==" >> debug_log.txt
          curl -sL --max-time 10 -A "$UA" https://internationals.site/ -D - -o /tmp/https_body.html >> debug_log.txt 2>&1
          head -c 1500 /tmp/https_body.html >> debug_log.txt
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
