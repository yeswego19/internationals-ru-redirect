name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable website hosting via S3 API
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          set +e
          echo "== set website config on www.internationals.site ==" > debug_log.txt
          aws s3api put-bucket-website --bucket www.internationals.site \
            --endpoint-url https://storage.yandexcloud.net \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}' >> debug_log.txt 2>&1
          echo "exit_set=$?" >> debug_log.txt
          echo "== read back website config ==" >> debug_log.txt
          aws s3api get-bucket-website --bucket www.internationals.site \
            --endpoint-url https://storage.yandexcloud.net >> debug_log.txt 2>&1
          echo "exit_get=$?" >> debug_log.txt
          echo "== also enable on internationals-site bucket ==" >> debug_log.txt
          aws s3api put-bucket-website --bucket internationals-site \
            --endpoint-url https://storage.yandexcloud.net \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}' >> debug_log.txt 2>&1
          echo "exit_set2=$?" >> debug_log.txt
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
