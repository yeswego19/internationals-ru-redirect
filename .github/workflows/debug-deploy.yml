name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        continue-on-error: true
        run: |
          set +e
          echo "== live radio button markup (from bucket) ==" > debug_log.txt
          curl -s https://www.internationals.site/index-ru.html | grep -o "radio.html.\{0,160\}" >> debug_log.txt
          echo >> debug_log.txt
          echo "== live radio-icon-mask CSS (from bucket) ==" >> debug_log.txt
          curl -s https://www.internationals.site/styles.css | grep -o "radio-icon-mask{[^}]*}\|btn-radio{[^}]*}" >> debug_log.txt
          echo >> debug_log.txt
          echo "== bare domain check (Beget) ==" >> debug_log.txt
          curl -sIL --max-time 10 http://internationals.site/ >> debug_log.txt 2>&1
          echo >> debug_log.txt
          echo "== https bare domain check ==" >> debug_log.txt
          curl -sIL --max-time 10 https://internationals.site/ >> debug_log.txt 2>&1
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
