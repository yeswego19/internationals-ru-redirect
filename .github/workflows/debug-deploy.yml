name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        continue-on-error: true
        run: |
          set +e
          echo "== bgMusic/volume-control count (should be 0) ==" > debug_log.txt
          curl -s https://www.internationals.site/index-ru.html | grep -c "bgMusic\|volume-control" >> debug_log.txt
          echo "== musicToggle/languageDropdown count (should be >0) ==" >> debug_log.txt
          curl -s https://www.internationals.site/index-ru.html | grep -c "musicToggle\|languageDropdown" >> debug_log.txt
          echo "== taxi.html bgMusic (should be 0) ==" >> debug_log.txt
          curl -s https://www.internationals.site/taxi.html | grep -c "bgMusic" >> debug_log.txt
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
