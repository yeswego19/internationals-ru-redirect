name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check acme CNAME
        continue-on-error: true
        run: |
          set +e
          echo "== dig CNAME acme-challenge.www (default resolver) ==" > debug_log.txt
          dig +short CNAME _acme-challenge.www.internationals.site >> debug_log.txt 2>&1
          echo "== via Google DNS 8.8.8.8 ==" >> debug_log.txt
          dig @8.8.8.8 +short CNAME _acme-challenge.www.internationals.site >> debug_log.txt 2>&1
          echo "== via Cloudflare 1.1.1.1 ==" >> debug_log.txt
          dig @1.1.1.1 +short CNAME _acme-challenge.www.internationals.site >> debug_log.txt 2>&1
          echo "== full dig output ==" >> debug_log.txt
          dig _acme-challenge.www.internationals.site CNAME >> debug_log.txt 2>&1
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
