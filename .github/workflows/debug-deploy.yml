name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bare domain
        continue-on-error: true
        run: |
          set +e
          echo "== HTTP (no www) ==" > debug_log.txt
          curl -sIL --max-time 10 http://internationals.site/ >> debug_log.txt 2>&1
          echo >> debug_log.txt
          echo "== HTTPS (no www) ==" >> debug_log.txt
          curl -sIL --max-time 10 https://internationals.site/ >> debug_log.txt 2>&1
          echo >> debug_log.txt
          echo "== DNS A record ==" >> debug_log.txt
          dig +short A internationals.site >> debug_log.txt 2>&1
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
