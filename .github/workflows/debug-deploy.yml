name: Debug Yandex Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try sync and capture output
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set +e
          echo "== aws --version ==" > debug_log.txt
          aws --version >> debug_log.txt 2>&1
          echo "== ls bucket ==" >> debug_log.txt
          aws s3 ls s3://internationals.site --endpoint-url https://storage.yandexcloud.net >> debug_log.txt 2>&1
          echo "exit_ls=$?" >> debug_log.txt
          echo "== sync (dry) ==" >> debug_log.txt
          aws s3 sync . s3://internationals.site --dryrun --endpoint-url https://storage.yandexcloud.net --exclude ".git/*" --exclude "node_modules/*" >> debug_log.txt 2>&1
          echo "exit_sync=$?" >> debug_log.txt
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug@example.com"
          git add debug_log.txt
          git commit -m "debug log" || echo "nothing to commit"
          git push
