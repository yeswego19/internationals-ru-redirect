name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try SetHTTPSConfig via signed REST call
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          set +e
          echo '{"certificateManagerCertificate":{"certificateId":"fpq1eqao8ac60d5faq30"}}' > body.json
          curl -sS --aws-sigv4 "aws:amz:ru-central1:s3" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -X POST "https://storage.api.cloud.yandex.net/storage/v1/buckets/www.internationals.site:setHttpsConfig" \
            -H "Content-Type: application/json" \
            --data @body.json -w "\nHTTP_STATUS:%{http_code}\n" > debug_log.txt 2>&1
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
