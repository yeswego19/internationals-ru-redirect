name: Debug Yandex Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check radio icon asset
        continue-on-error: true
        run: |
          set +e
          echo "== HEAD assets/radio-icon.svg ==" > debug_log.txt
          curl -sI https://www.internationals.site/assets/radio-icon.svg >> debug_log.txt
          echo "== content ==" >> debug_log.txt
          curl -s https://www.internationals.site/assets/radio-icon.svg >> debug_log.txt
          echo >> debug_log.txt
          echo "== footer radio button markup ==" >> debug_log.txt
          curl -s https://www.internationals.site/index-ru.html | grep -o "radio.html.\{0,160\}" >> debug_log.txt
          echo >> debug_log.txt
          echo "== footer copyright line ==" >> debug_log.txt
          curl -s https://www.internationals.site/index-ru.html | grep -o ".\{40\}Internationals.\{0,30\}Privacy.\{0,10\}\|.\{40\}prava.\{0,60\}\|.\{40\}2026.\{0,80\}" >> debug_log.txt
          cat debug_log.txt
      - name: Commit debug log
        if: always()
        run: |
          git config user.name "debug-bot"; git config user.email "debug@example.com"
          git add debug_log.txt; git commit -m "debug log" || echo none; git push
