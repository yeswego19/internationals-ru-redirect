name: One-off Beget redirect upload
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare redirect files
        run: |
          mkdir -p redirect_only
          cat > redirect_only/.htaccess << 'HTACCESS'
RewriteEngine On
RewriteCond %{HTTP_HOST} ^internationals\.site$ [NC]
RewriteRule ^(.*)$ https://www.internationals.site/$1 [R=301,L]
HTACCESS
          cat > redirect_only/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=https://www.internationals.site/">
<link rel="canonical" href="https://www.internationals.site/">
<title>Internationals - redirect</title>
<script>window.location.replace("https://www.internationals.site/");</script>
</head>
<body>
<p>Site moved: <a href="https://www.internationals.site/">www.internationals.site</a></p>
</body>
</html>
HTMLEOF
      - name: Upload redirect files to Beget root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./redirect_only/
          server-dir: ./
